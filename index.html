<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<title>دفترچه یادداشت</title>


<style>
    h1 {
    text-align: center;
    margin-bottom: 20px;
}
    

    body {
        font-family: tahoma;
        width: 700px;
        margin: auto;
        margin-top: 30px;
    }
    .noteText {

max-height: 45px;
overflow: hidden;

}


.noteText.expanded {

max-height: none;

}


.moreButton {

margin-top: 5px;
cursor: pointer;

}

    input,
    textarea,
    select {

        width: 100%;
        padding: 10px;
        margin: 5px 0;
        box-sizing: border-box;
        border-radius: 6px;
        input:focus, textarea:focus, select:focus {
        outline: 2px solid #888;
       }

    }
    textarea {
    min-height: 120px;
    resize: vertical;
    }


    button {

        padding: 8px 16px;
       margin-left: 5px;
       border: 1px solid #ccc;
       border-radius: 6px;
       cursor: pointer;

    }
    


    .noteCard {

        border: 1px solid #ccc;
        padding: 15px;
        margin-top: 15px;
        border-radius: 8px;

    }
    .categoryManagement {

        border: 8px solid #6b4226 !important;
         padding: 20px;
        margin-top: 20px;
        margin-bottom: 20px;
        border-radius: 10px;

    }
    .categoryManagement h3 {

      font-weight: bold;
      font-size: 20px;

    }


    .star-btn {

        cursor: pointer;
        font-size: 1.2em;
        margin-left: 10px;

    }


    .category {

        color: gray;
        font-size: 14px;

    }


    .categoryBox {

        margin-top: 15px;
        margin-bottom: 15px;

    }


    .categoryManagement {

        border: 1px solid gray;
        padding: 10px;
        margin-top: 10px;

    }
    .categoryManagement select,
    .categoryManagement input {
    margin-bottom: 10px;
}
#welcomeScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background-color: white;

    animation: welcomeAnimation 3s forwards;
}

#welcomeScreen h1 {
    font-size: 50px;
    opacity: 0;

    animation: welcomeTextAnimation 3s forwards;
}

@keyframes welcomeAnimation {
    0% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }
}

@keyframes welcomeTextAnimation {
    0% {
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

</style>

</head>


<body>
    <div id="welcomeScreen">
        <h1>Welcome</h1>
    </div>


<h2>دفترچه یادداشت</h2>


<input
    type="text"
    id="titleInput"
    placeholder="عنوان"
>


<textarea
    id="contentInput"
    rows="5"
    placeholder="متن یادداشت">
</textarea>


<select id="categoryInput">
</select>


<br>


<button onclick="saveNote()">
    ذخیره
</button>


<div class="categoryBox">

    <input
        type="text"
        id="newCategoryInput"
        placeholder="نام دسته جدید"
    >


    <button onclick="addCategory()">
        افزودن دسته
    </button>

</div>


<hr>


<input
    type="text"
    id="searchInput"
    placeholder="جستجو بین یادداشت‌ها"
    oninput="filterNotes()"
>


<select
    id="categoryFilter"
    onchange="filterNotes()"
>
</select>


<div class="categoryManagement">

    <h3>مدیریت دسته‌ها</h3>


    <select id="categoryManagementSelect">
    </select>


    <br>


    <input
        type="text"
        id="editCategoryInput"
        placeholder="نام جدید دسته"
    >


    <button onclick="editCategory()">
        ویرایش دسته
    </button>


    <button onclick="deleteCategory()">
        حذف دسته
    </button>

</div>


<div id="notesContainer"></div>



<script>


let savedNotes =
    JSON.parse(
        localStorage.getItem("noteStorage")
    ) || [];


let noteCategories =
    JSON.parse(
        localStorage.getItem("categories")
    ) ||
    ["درس", "کار", "ایده", "شخصی"];


let editingNoteIndex = null;



showCategories();

showNotes();



function showCategories() {

    let noteCategorySelect =
        document.getElementById("categoryInput");


    let categoryFilterSelect =
        document.getElementById("categoryFilter");


    let categoryManagementSelect =
        document.getElementById(
            "categoryManagementSelect"
        );


    noteCategorySelect.innerHTML = "";


    categoryFilterSelect.innerHTML =
        "<option value='all'>همه دسته‌ها</option>";


    categoryManagementSelect.innerHTML = "";



    for (
        let categoryIndex = 0;
        categoryIndex < noteCategories.length;
        categoryIndex++
    ) {

        let currentCategory =
            noteCategories[categoryIndex];


        noteCategorySelect.innerHTML +=

            "<option value='" +
            currentCategory +
            "'>" +
            currentCategory +
            "</option>";


        categoryFilterSelect.innerHTML +=

            "<option value='" +
            currentCategory +
            "'>" +
            currentCategory +
            "</option>";


        categoryManagementSelect.innerHTML +=

            "<option value='" +
            currentCategory +
            "'>" +
            currentCategory +
            "</option>";

    }

}

function toggleMore(noteIndex) {

let noteTextElement =
    document.getElementById(
        "noteText-" + noteIndex
    );


let moreButton =
    document.getElementById(
        "moreButton-" + noteIndex
    );


if (
    noteTextElement.classList.contains("expanded")
) {

    noteTextElement.classList.remove("expanded");

    moreButton.innerText = "بیشتر";

}

else {

    noteTextElement.classList.add("expanded");

    moreButton.innerText = "کمتر";

}

}

function addCategory() {

    let newCategoryName =
        document
        .getElementById("newCategoryInput")
        .value
        .trim();


    if (newCategoryName === "") {

        alert("لطفاً نام دسته را وارد کن.");

        return;

    }


    if (
        noteCategories.includes(newCategoryName)
    ) {

        alert("این دسته قبلاً وجود دارد.");

        return;

    }


    noteCategories.push(newCategoryName);


    localStorage.setItem(
        "categories",
        JSON.stringify(noteCategories)
    );


    showCategories();


    document.getElementById(
        "newCategoryInput"
    ).value = "";

}



function editCategory() {

    let selectedCategoryName =
        document
        .getElementById(
            "categoryManagementSelect"
        )
        .value;


    let newCategoryName =
        document
        .getElementById(
            "editCategoryInput"
        )
        .value
        .trim();


    if (newCategoryName === "") {

        alert("لطفاً نام جدید دسته را وارد کن.");

        return;

    }


    if (
        noteCategories.includes(newCategoryName)
    ) {

        alert("این دسته قبلاً وجود دارد.");

        return;

    }


    let categoryIndex =
        noteCategories.indexOf(
            selectedCategoryName
        );


    noteCategories[categoryIndex] =
        newCategoryName;


    for (
        let noteIndex = 0;
        noteIndex < savedNotes.length;
        noteIndex++
    ) {

        if (
            savedNotes[noteIndex].category ===
            selectedCategoryName
        ) {

            savedNotes[noteIndex].category =
                newCategoryName;

        }

    }


    localStorage.setItem(
        "categories",
        JSON.stringify(noteCategories)
    );


    localStorage.setItem(
        "noteStorage",
        JSON.stringify(savedNotes)
    );


    showCategories();

    showNotes();


    document.getElementById(
        "editCategoryInput"
    ).value = "";

}



function deleteCategory() {

    let selectedCategoryName =
        document
        .getElementById(
            "categoryManagementSelect"
        )
        .value;


    let deleteConfirmation =
        confirm(
            "آیا مطمئنی می‌خواهی این دسته حذف شود؟"
        );


    if (
        deleteConfirmation === false
    ) {

        return;

    }


    let categoryIndex =
        noteCategories.indexOf(
            selectedCategoryName
        );


    noteCategories.splice(
        categoryIndex,
        1
    );


    for (
        let noteIndex = 0;
        noteIndex < savedNotes.length;
        noteIndex++
    ) {

        if (
            savedNotes[noteIndex].category ===
            selectedCategoryName
        ) {

            savedNotes[noteIndex].category =
                "";

        }

    }


    localStorage.setItem(
        "categories",
        JSON.stringify(noteCategories)
    );


    localStorage.setItem(
        "noteStorage",
        JSON.stringify(savedNotes)
    );


    showCategories();

    showNotes();

}



function toggleStar(noteIndex) {

    if (
        savedNotes[noteIndex].isStarred === undefined
    ) {

        savedNotes[noteIndex].isStarred = false;

    }


    savedNotes[noteIndex].isStarred =
        !savedNotes[noteIndex].isStarred;


    localStorage.setItem(
        "noteStorage",
        JSON.stringify(savedNotes)
    );


    showNotes();

}



function saveNote() {

    let noteTitle =
        document
        .getElementById("titleInput")
        .value;


    let noteContent =
        document
        .getElementById("contentInput")
        .value;


    let selectedCategory =
        document
        .getElementById("categoryInput")
        .value;



    if (editingNoteIndex === null) {

        savedNotes.push({

            title: noteTitle,

            content: noteContent,

            category: selectedCategory,

            isStarred: false

        });

    }


    else {

        savedNotes[
            editingNoteIndex
        ].title = noteTitle;


        savedNotes[
            editingNoteIndex
        ].content = noteContent;


        savedNotes[
            editingNoteIndex
        ].category = selectedCategory;


        editingNoteIndex = null;

    }



    localStorage.setItem(
        "noteStorage",
        JSON.stringify(savedNotes)
    );


    showNotes();


    document.getElementById(
        "titleInput"
    ).value = "";


    document.getElementById(
        "contentInput"
    ).value = "";

}



function editNote(noteIndex) {

    document.getElementById(
        "titleInput"
    ).value =
        savedNotes[noteIndex].title;


    document.getElementById(
        "contentInput"
    ).value =
        savedNotes[noteIndex].content;


    document.getElementById(
        "categoryInput"
    ).value =
        savedNotes[noteIndex].category;


    editingNoteIndex = noteIndex;

}



function deleteNote(noteIndex) {

    let deleteConfirmation =
        confirm(
            "آیا مطمئنی می‌خواهی این یادداشت حذف شود؟"
        );


    if (
        deleteConfirmation === true
    ) {

        savedNotes.splice(
            noteIndex,
            1
        );


        localStorage.setItem(
            "noteStorage",
            JSON.stringify(savedNotes)
        );


        showNotes();

    }

}



function createNoteHTML(noteData, noteIndex) {


    let isLongNote =
    noteData.content.length > 100;

    let starStatus =
        noteData.isStarred === true;


    let starSymbol =
        starStatus ? "⭐" : "☆";

    
    let moreButtonHTML = "";
    if (isLongNote) {
        moreButtonHTML =

        "<button " +
        "id='moreButton-" +
        noteIndex +
        "' " +
       "class='moreButton' " +
       "onclick='toggleMore(" +
       noteIndex +
       ")'>" +

        "بیشتر" +

        "</button>";

}


    return "<div class='noteCard'>" +

        "<span class='star-btn' onclick='toggleStar(" +
        noteIndex +
        ")'>" +

        starSymbol +

        "</span>" +


        "<h3>" +
        noteData.title +
        "</h3>" +
        "<p id='noteText-" +
           noteIndex +
           "' class='noteText'>" +

           noteData.content +

           "</p>" +
           moreButtonHTML +

                     


        


        "<p class='category'>" +
        "دسته: " +
        noteData.category +
        "</p>" +


        "<button onclick='editNote(" +
        noteIndex +
        ")'>" +

        "ویرایش" +

        "</button>" +


        "<button onclick='deleteNote(" +
        noteIndex +
        ")'>" +

        "حذف" +

        "</button>" +


        "</div>";

}



function showNotes() {

    let notesDisplayArea =
        document.getElementById(
            "notesContainer"
        );


    notesDisplayArea.innerHTML = "";


    for (
        let noteIndex = 0;
        noteIndex < savedNotes.length;
        noteIndex++
    ) {

        notesDisplayArea.innerHTML +=

            createNoteHTML(
                savedNotes[noteIndex],
                noteIndex
            );

    }

}



function filterNotes() {

    let searchText =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    let selectedCategory =
        document
        .getElementById("categoryFilter")
        .value;


    let filteredNotesArea =
        document.getElementById(
            "notesContainer"
        );


    filteredNotesArea.innerHTML = "";


    for (
        let noteIndex = 0;
        noteIndex < savedNotes.length;
        noteIndex++
    ) {

        let currentNote =
            savedNotes[noteIndex];


        let titleContainsSearchText =
            currentNote.title
            .toLowerCase()
            .includes(searchText);


        let contentContainsSearchText =
            currentNote.content
            .toLowerCase()
            .includes(searchText);


        let searchMatches =
            titleContainsSearchText ||
            contentContainsSearchText;


        let categoryMatches =
            selectedCategory === "all" ||
            currentNote.category === selectedCategory;


        if (
            searchMatches &&
            categoryMatches
        ) {

            filteredNotesArea.innerHTML +=

                createNoteHTML(
                    currentNote,
                    noteIndex
                );

        }

    }

}


</script>

</body>

</html>
